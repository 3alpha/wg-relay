[package]
name = "wg-relay"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
blake2s_simd = "1.0.5"
boringtun = { version = "0.7.1", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
papaya = "0.2.5"
quinn-udp = { version = "0.6.3", default-features = false }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "time", "macros", "signal", "sync"] }
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["socket"] }
rustix = { version = "1.1", default-features = false, features = ["std", "net"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
