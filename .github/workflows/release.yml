name: release

# Publishes when the version in Cargo.toml changes on master and CI is green:
# multi-arch image to GHCR, the vX.Y.Z tag and a GitHub Release.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  detect-version-change:
    name: detect version change
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
          fetch-tags: true
      - id: version
        run: |
          version() { sed -n 's/^version = "\(.*\)"$/\1/p' | head -n1; }
          new=$(version < Cargo.toml)
          old=$(git show HEAD^:Cargo.toml 2>/dev/null | version || true)
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$new" >/dev/null; then
            echo "v$new is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = workflow_dispatch ] || [ "$new" != "$old" ]; then
            echo "releasing v$new (was ${old:-none})"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version unchanged at $new"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: image (${{ matrix.arch }})
    needs: detect-version-change
    if: needs.detect-version-change.outputs.release == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect-version-change.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: rust
        run: |
          version=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          grep -qx "ARG RUST_VERSION=$version" Dockerfile || { echo "Dockerfile's RUST_VERSION differs from rust-toolchain.toml ($version)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: RUST_VERSION=${{ steps.rust.outputs.version }}
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ needs.detect-version-change.outputs.version }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.detect-version-change.outputs.sha }}
            org.opencontainers.image.version=${{ needs.detect-version-change.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    name: multi-arch manifest
    needs: [detect-version-change, image]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.detect-version-change.outputs.version }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:${VERSION%.*}" \
            --tag "$IMAGE:latest" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"

  release:
    name: tag and GitHub Release
    needs: [detect-version-change, manifest]
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.detect-version-change.outputs.version }}
      SHA: ${{ needs.detect-version-change.outputs.sha }}
    steps:
      - run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "v$VERSION" \
            --generate-notes \
            --notes "Image: \`$IMAGE:$VERSION\` (linux/amd64, linux/arm64)"
