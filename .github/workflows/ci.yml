name: ci

on:
  pull_request:
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "clippy.toml"
      - "tests/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/**"
  push:
    branches: [master]
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "clippy.toml"
      - "tests/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/**"
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the version and components.
      - run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

  netns:
    name: namespace test (kernel WireGuard behind NAT)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools iptables tcpdump iputils-ping iproute2
      - run: sudo modprobe wireguard
      # Ubuntu confines wg to /etc/wireguard and tcpdump to *.pcap files; the
      # test keeps its keys and logs in a temporary directory.
      - run: sudo apparmor_parser -R /etc/apparmor.d/wg /etc/apparmor.d/usr.bin.tcpdump
      - run: cargo build --locked --bins --examples
      - run: sudo tests/netns.sh

  image:
    name: image builds
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: rust
        run: |
          version=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          grep -qx "ARG RUST_VERSION=$version" Dockerfile || { echo "Dockerfile's RUST_VERSION differs from rust-toolchain.toml ($version)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: RUST_VERSION=${{ steps.rust.outputs.version }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
