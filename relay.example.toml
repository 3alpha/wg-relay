# Check: wg-relay --check-config -c relay.toml    Reload: kill -HUP <pid>
# Every key is described in docs/reference.md.

private_key = "<output of wg genkey>"
listen = "0.0.0.0:51820"

# Optional; defaults shown, or unset where commented out.
tunnel_ip = "10.99.0.254"
handshake_rate_per_ip = "10/s"
# public_endpoint = "relay.example.com:51820"
# workers = 4
# metrics_listen = "127.0.0.1:9586"

# One block per peer that others connect to but cannot reach directly, usually
# a server behind NAT. The relay makes it reachable.
[[peer]]
name = "home"
pubkey = "<the peer's WireGuard public key>"
